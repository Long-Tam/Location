<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mình đang ở đâu? · Lễ Tốt nghiệp Bách Khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A3A8C; --blue-deep:#062659; --ink:#14213D; --muted:#5A6684; --gold:#B5852A;
  --mist:#EEF2F9; --line:#C9D3E6; --paper:#fff; --bg:#F6F8FC; --ok:#2E7D4F; --warn:#B5852A;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; line-height:1.5}
.wrap{max-width:820px; margin:0 auto; padding:20px 14px 40px}
header{border-top:8px solid var(--blue); background:var(--paper); border-left:1px solid var(--line); border-right:1px solid var(--line); padding:18px 18px 14px}
.eyebrow{font-size:13px; color:var(--blue); font-weight:500; margin:0}
h1{font-family:'Lora',Georgia,serif; color:var(--blue-deep); font-size:clamp(26px,6vw,36px); line-height:1.15; margin:4px 0 0}

.status{display:flex; gap:12px; align-items:flex-start; background:var(--paper); border:1px solid var(--line); border-top:0; padding:14px 18px}
.dot{flex:none; width:12px; height:12px; border-radius:50%; margin-top:6px; background:var(--line)}
.dot.live{background:var(--ok); box-shadow:0 0 0 0 rgba(46,125,79,.5); animation:pulse 2s infinite}
.dot.stale{background:var(--warn)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(46,125,79,0)}100%{box-shadow:0 0 0 0 rgba(46,125,79,0)}}
.status-text{font-weight:700; font-size:17px; margin:0}
.status-time{font-size:14px; color:var(--muted); margin:2px 0 0}

.map{position:relative; margin-top:14px; border:1px solid var(--line); background:var(--paper); line-height:0; touch-action:manipulation}
.map img{width:100%; height:auto; display:block; user-select:none; -webkit-user-drag:none}
.me,.ghost{position:absolute; transform:translate(-50%,-100%); pointer-events:none; line-height:0; transition:left .6s ease, top .6s ease}
.me svg,.ghost svg{width:clamp(28px,6vw,42px); height:auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.me::after{content:""; position:absolute; left:50%; bottom:-4px; width:22px; height:8px; transform:translateX(-50%); border-radius:50%; background:rgba(181,133,42,.45); animation:ground 2s infinite}
@keyframes ground{50%{transform:translateX(-50%) scale(1.6); opacity:.2}}
.ghost{opacity:.55}
.hidden{display:none !important}
.map-note{font-size:13px; color:var(--muted); margin:8px 0 0}

/* Bảng điều khiển */
.panel{margin-top:22px; background:var(--paper); border:1px solid var(--line); border-left:6px solid var(--gold); padding:18px}
.panel h2{font-family:'Lora',Georgia,serif; font-size:21px; color:var(--blue-deep); margin:0 0 4px}
.panel p{margin:0 0 12px; font-size:14px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.chip{border:1.5px solid var(--blue); background:transparent; color:var(--blue); font:inherit; font-size:14px; font-weight:500; padding:8px 12px; border-radius:999px; cursor:pointer}
.chip:hover,.chip.on{background:var(--blue); color:#fff}
label{display:block; font-size:14px; font-weight:500; margin-bottom:4px}
input[type=text],input[type=password]{width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1.5px solid var(--line); border-radius:6px; background:#fff; color:var(--ink)}
input:focus{outline:3px solid rgba(10,58,140,.25); border-color:var(--blue)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
.btn{font:inherit; font-weight:700; font-size:16px; padding:12px 20px; border:2px solid var(--blue); background:var(--blue); color:#fff; cursor:pointer; border-radius:6px}
.btn:disabled{opacity:.5; cursor:default}
.btn.ghosty{background:transparent; color:var(--blue)}
.toggle{display:flex; align-items:center; gap:8px; font-size:15px; margin-top:12px}
.toggle input{width:20px; height:20px}
.msg{font-size:14px; margin:10px 0 0; min-height:1.4em}
.msg.err{color:#A12E2E} .msg.ok{color:var(--ok)}
.back{display:inline-block; margin-top:24px; color:var(--blue); font-weight:500}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Lễ Tốt nghiệp · Thứ Sáu, 27/11/2026 · Đại học Bách Khoa</p>
    <h1 id="title">Mình đang ở đâu?</h1>
  </header>

  <div class="status" aria-live="polite">
    <span class="dot" id="dot"></span>
    <div>
      <p class="status-text" id="statusText">Đang tải vị trí…</p>
      <p class="status-time" id="statusTime"></p>
    </div>
  </div>

  <div class="map" id="map">
    <img id="mapImg" alt="Sơ đồ khuôn viên Trường Đại học Bách khoa">
    <span class="me hidden" id="me" aria-hidden="true"><svg viewBox="0 0 32 42"><path d="M16 41C10 31 2 25 2 15a14 14 0 1 1 28 0c0 10-8 16-14 26z" fill="#B5852A" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="6" fill="#fff"/></svg></span>
    <span class="ghost hidden" id="ghost" aria-hidden="true"><svg viewBox="0 0 32 42"><path d="M16 41C10 31 2 25 2 15a14 14 0 1 1 28 0c0 10-8 16-14 26z" fill="#0A3A8C" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="6" fill="#fff"/></svg></span>
  </div>
  <p class="map-note" id="mapNote">Trang tự làm mới mỗi 20 giây.</p>

  <!-- Bảng điều khiển: chỉ hiện khi mở trang với ?admin ở cuối link -->
  <section class="panel hidden" id="panel">
    <h2>Cập nhật vị trí của mình</h2>
    <p>Chạm vào bản đồ hoặc chọn nhanh một điểm, thêm ghi chú nếu muốn, rồi bấm “Cập nhật”.</p>

    <div id="pinBox">
      <label for="pin">Mật khẩu (PIN)</label>
      <input type="password" id="pin" autocomplete="current-password" placeholder="PIN bạn đặt trong Apps Script">
    </div>

    <div class="chips" id="chips" style="margin-top:14px"></div>

    <label for="statusInput">Ghi chú (không bắt buộc)</label>
    <input type="text" id="statusInput" maxlength="120" placeholder="Ví dụ: Đang chụp ảnh với lớp ở sân bóng">

    <label class="toggle"><input type="checkbox" id="hideBox"> Tạm ẩn vị trí với khách</label>

    <div class="row">
      <button class="btn" id="sendBtn" disabled>Cập nhật</button>
      <button class="btn ghosty" id="forgetBtn" type="button">Quên PIN trên máy này</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>

  <a class="back" id="back" href="#">← Quay lại thư mời</a>
</div>

<script>
/* ===================== ✏️ SỬA PHẦN NÀY ===================== */
const CONFIG = {
  API_URL:   'DAN_LINK_WEB_APP_APPS_SCRIPT_VAO_DAY',   // link .../exec từ bước Deploy
  MAP_IMAGE: 'https://nhlongnhi.wordpress.com/wp-content/uploads/2026/11/img_1_1794718173838.jpg',
  NAME:      'Nguyễn Văn A',
  INVITE_URL:'https://nhlongnhi.wordpress.com/',
  REFRESH_SECONDS: 20,
  STALE_MINUTES: 45
};
/* Điểm chọn nhanh: vị trí tính theo % chiều ngang / dọc của ảnh bản đồ */
const SPOTS = [
  { name: 'Hội trường A5', x: 43.8, y: 38, status: 'Mình đang ở Hội trường A5' },
  { name: 'Tòa B1',        x: 22.2, y: 64, status: 'Mình đang ở tòa B1' },
  { name: 'Sân bóng',      x: 35.1, y: 51, status: 'Mình đang chụp ảnh ở sân bóng' },
  { name: 'Cổng 1',        x: 17.5, y: 44, status: 'Mình đang ra đón ở Cổng 1' }
];
/* ========================================================== */

const $ = id => document.getElementById(id);
const isAdmin = new URLSearchParams(location.search).has('admin');
const configured = CONFIG.API_URL.startsWith('https://');
let pending = null;        // vị trí đang chọn (chưa gửi)
let current = null;        // vị trí đã lưu trên máy chủ

$('mapImg').src = CONFIG.MAP_IMAGE;
$('back').href = CONFIG.INVITE_URL;
$('title').textContent = CONFIG.NAME + ' đang ở đâu?';
document.title = CONFIG.NAME + ' đang ở đâu? · Lễ Tốt nghiệp';
$('mapNote').textContent = 'Trang tự làm mới mỗi ' + CONFIG.REFRESH_SECONDS + ' giây.';

function place(el, x, y){ el.style.left = x + '%'; el.style.top = y + '%'; el.classList.remove('hidden'); }

function ago(t){
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'vừa cập nhật';
  if (m < 60) return 'cập nhật ' + m + ' phút trước';
  const h = Math.floor(m / 60);
  return 'cập nhật ' + h + ' giờ ' + (m % 60) + ' phút trước';
}

function render(){
  const dot = $('dot');
  dot.className = 'dot';
  if (!configured){
    $('statusText').textContent = 'Chưa kết nối máy chủ vị trí.';
    $('statusTime').textContent = 'Hãy dán link Apps Script vào CONFIG.API_URL.';
    return;
  }
  if (!current || !current.t){
    $('statusText').textContent = CONFIG.NAME + ' chưa chia sẻ vị trí.';
    $('statusTime').textContent = '';
    $('me').classList.add('hidden');
    return;
  }
  if (current.hidden){
    $('statusText').textContent = CONFIG.NAME + ' đang tạm ẩn vị trí.';
    $('statusTime').textContent = ago(current.t);
    $('me').classList.add('hidden');
    return;
  }
  place($('me'), current.x, current.y);
  $('statusText').textContent = current.status || (CONFIG.NAME + ' đang ở vị trí trên bản đồ');
  const stale = (Date.now() - current.t) > CONFIG.STALE_MINUTES * 60000;
  $('statusTime').textContent = ago(current.t) + (stale ? ' · có thể mình đã đi chỗ khác' : '');
  dot.classList.add(stale ? 'stale' : 'live');
}

async function load(){
  if (!configured){ render(); return; }
  try{
    const r = await fetch(CONFIG.API_URL + '?t=' + Date.now(), { cache: 'no-store' });
    current = await r.json();
  }catch(e){
    $('statusTime').textContent = 'Không tải được vị trí, sẽ thử lại…';
    return;
  }
  render();
}

load();
setInterval(load, CONFIG.REFRESH_SECONDS * 1000);
setInterval(render, 30000); // cập nhật dòng "x phút trước"
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

/* ---------- Chế độ quản lý (chỉ khi link có ?admin) ---------- */
if (isAdmin){
  $('panel').classList.remove('hidden');
  let savedPin = '';
  try { savedPin = localStorage.getItem('bk-pin') || ''; } catch(e){}
  if (savedPin){ $('pin').value = savedPin; $('pinBox').classList.add('hidden'); }

  SPOTS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = s.name;
    b.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      pending = { x: s.x, y: s.y };
      $('statusInput').value = s.status;
      place($('ghost'), s.x, s.y);
      $('sendBtn').disabled = false;
    };
    $('chips').appendChild(b);
  });

  $('map').style.cursor = 'crosshair';
  $('map').addEventListener('click', e => {
    const r = $('mapImg').getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 100;
    const y = ((e.clientY - r.top) / r.height) * 100;
    pending = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    place($('ghost'), pending.x, pending.y);
    $('sendBtn').disabled = false;
    $('msg').textContent = 'Đã chọn điểm mới. Bấm “Cập nhật” để khách thấy.'; $('msg').className = 'msg';
  });

  $('hideBox').addEventListener('change', () => { $('sendBtn').disabled = false; });

  $('sendBtn').addEventListener('click', async () => {
    const pin = $('pin').value.trim();
    if (!configured){ $('msg').textContent = 'Chưa dán link Apps Script vào CONFIG.API_URL.'; $('msg').className = 'msg err'; return; }
    if (!pin){ $('msg').textContent = 'Nhập PIN trước nhé.'; $('msg').className = 'msg err'; $('pinBox').classList.remove('hidden'); return; }
    const pos = pending || current || { x: 50, y: 50 };
    $('sendBtn').disabled = true; $('msg').textContent = 'Đang gửi…'; $('msg').className = 'msg';
    try{
      const r = await fetch(CONFIG.API_URL, {
        method: 'POST',
        body: JSON.stringify({ pin, x: pos.x, y: pos.y, status: $('statusInput').value.trim(), hidden: $('hideBox').checked })
      });
      const res = await r.json();
      if (!res.ok){
        $('msg').textContent = res.error === 'pin' ? 'Sai PIN.' : 'Không lưu được, thử lại nhé.';
        $('msg').className = 'msg err'; $('pinBox').classList.remove('hidden');
        $('sendBtn').disabled = false; return;
      }
      try { localStorage.setItem('bk-pin', pin); } catch(e){}
      $('pinBox').classList.add('hidden');
      current = res.state; pending = null;
      $('ghost').classList.add('hidden');
      render();
      $('msg').textContent = 'Đã cập nhật! Khách sẽ thấy trong vòng ' + CONFIG.REFRESH_SECONDS + ' giây.'; $('msg').className = 'msg ok';
    }catch(e){
      $('msg').textContent = 'Lỗi mạng, thử lại nhé.'; $('msg').className = 'msg err';
      $('sendBtn').disabled = false;
    }
  });

  $('forgetBtn').addEventListener('click', () => {
    try { localStorage.removeItem('bk-pin'); } catch(e){}
    $('pin').value = ''; $('pinBox').classList.remove('hidden');
    $('msg').textContent = 'Đã xoá PIN khỏi máy này.'; $('msg').className = 'msg';
  });
}
</script>
</body>
</html>
